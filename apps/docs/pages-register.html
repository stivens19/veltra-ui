<!DOCTYPE html>
<html lang="es" >

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Veltra UI - Crear Cuenta (Registro)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
  
  <link rel="stylesheet" href="/src/style.css" />
  
  <script>
    (function() {
      try {
        const savedTheme = localStorage.getItem('veltra-theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>
</head>

<body class="vlt-grid-bg text-slate-800 antialiased selection:bg-cyan-500 selection:text-white bg-slate-50 min-h-screen flex flex-col justify-between dark:bg-slate-950 dark:text-slate-100">
  
  <!-- Subtle decorative ambient lights -->
  <div class="fixed top-0 left-1/2 -translate-x-1/2 w-[800px] h-[300px] bg-gradient-to-b from-cyan-400/15 to-transparent blur-3xl pointer-events-none -z-10"></div>

  <!-- Header Mini Navigation -->
  <header class="p-6 flex items-center justify-between max-w-6xl mx-auto w-full">
    <a href="/index.html" class="flex items-center gap-2.5 group">
      <img src="/logo.png" alt="VeltraUI" class="w-8 h-8 rounded-xl object-contain shadow-xs" />
      <span class="text-lg font-black text-slate-900 tracking-tight">
        Veltra<span class="text-cyan-500">UI</span>
      </span>
    </a>
    <a href="/index.html" class="text-xs font-bold text-slate-500 hover:text-cyan-600 flex items-center gap-1.5 transition-colors">
      <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Volver al Dashboard
    </a>
  </header>

  <!-- Auth Card Center Container -->
  <main class="flex-1 flex items-center justify-center p-4 sm:p-6 my-4">
    <div class="vlt-auth-card">
      
      <!-- Card Title & Intro -->
      <div class="text-center mb-6">
        <div class="w-12 h-12 rounded-2xl bg-cyan-50 dark:bg-cyan-950/40 text-cyan-600 flex items-center justify-center mx-auto mb-3 shadow-xs">
          <i data-lucide="user-plus" class="w-6 h-6"></i>
        </div>
        <h1 class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">Crear una Cuenta</h1>
        <p class="text-xs text-slate-500 mt-1">Comienza tu prueba gratuita empresarial de 14 días con VeltraUI.</p>
      </div>

      <!-- Social Logins -->
      <div class="grid grid-cols-2 gap-3 mb-5">
        <button type="button" class="py-2.5 px-3 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs font-bold flex items-center justify-center gap-2 transition-colors cursor-pointer dark:bg-slate-950 dark:text-slate-100" onclick="alert('Registro mediante Google OAuth 2.0')">
          <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.7-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/><path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.8s.2-2.1.4-2.8L1.9 6.3C.7 8.7 0 10.3 0 12s.7 3.3 1.9 5.7l3.7-2.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2-6.4-4.8L1.9 16.4C3.7 20.4 7.5 23 12 23z"/></svg>
          Google
        </button>
        <button type="button" class="py-2.5 px-3 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs font-bold flex items-center justify-center gap-2 transition-colors cursor-pointer dark:bg-slate-950 dark:text-slate-100" onclick="alert('Registro mediante GitHub')">
          <i data-lucide="github" class="w-4 h-4"></i>
          GitHub
        </button>
      </div>

      <!-- Divider -->
      <div class="relative flex py-2 items-center mb-5">
        <div class="flex-grow border-t border-slate-200"></div>
        <span class="flex-shrink mx-3 text-[11px] font-semibold text-slate-400 uppercase tracking-wider">o ingresa tus datos</span>
        <div class="flex-grow border-t border-slate-200"></div>
      </div>

      <!-- Registration Form -->
      <form class="space-y-4" onsubmit="event.preventDefault(); alert('¡Cuenta creada exitosamente! Redirigiendo...'); window.location.href='/index.html';">
        <!-- Full Name -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Nombre Completo</label>
          <div class="relative">
            <i data-lucide="user" class="w-4 h-4 text-slate-400 absolute left-3.5 top-2.5 pointer-events-none"></i>
            <input type="text" required placeholder="Carlos Mendoza" class="w-full pl-10 pr-3 py-2 text-xs rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:border-cyan-500 text-slate-800 placeholder:text-slate-400 dark:bg-slate-950 dark:text-slate-100" />
          </div>
        </div>

        <!-- Corporate Email -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Correo Corporativo</label>
          <div class="relative">
            <i data-lucide="mail" class="w-4 h-4 text-slate-400 absolute left-3.5 top-2.5 pointer-events-none"></i>
            <input type="email" required placeholder="carlos@empresa.com" class="w-full pl-10 pr-3 py-2 text-xs rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:border-cyan-500 text-slate-800 placeholder:text-slate-400 dark:bg-slate-950 dark:text-slate-100" />
          </div>
        </div>

        <!-- Password with Strength Indicator -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Contraseña</label>
          <div class="relative">
            <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3.5 top-2.5 pointer-events-none"></i>
            <input id="reg-password" type="password" required placeholder="Mínimo 8 caracteres" class="w-full pl-10 pr-10 py-2 text-xs rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:border-cyan-500 text-slate-800 placeholder:text-slate-400 dark:bg-slate-950 dark:text-slate-100" oninput="checkPasswordStrength(this.value)" />
            <button type="button" class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600 cursor-pointer" onclick="togglePasswordVisibility('reg-password', this)">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
          
          <!-- Strength Bar -->
          <div class="mt-2 space-y-1">
            <div class="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden flex gap-1">
              <div id="bar-1" class="h-full w-1/3 bg-slate-200 rounded-full transition-colors"></div>
              <div id="bar-2" class="h-full w-1/3 bg-slate-200 rounded-full transition-colors"></div>
              <div id="bar-3" class="h-full w-1/3 bg-slate-200 rounded-full transition-colors"></div>
            </div>
            <div class="flex items-center justify-between text-[10px] text-slate-400">
              <span id="strength-label">Ingresa una contraseña segura</span>
              <span>Mayúsculas + números</span>
            </div>
          </div>
        </div>

        <!-- Terms & Conditions Checkbox -->
        <div class="pt-1">
          <label class="flex items-start gap-2 cursor-pointer text-xs text-slate-600 select-none">
            <input type="checkbox" required class="w-4 h-4 accent-cyan-600 rounded cursor-pointer mt-0.5 shrink-0" />
            <span>Acepto los <a href="#" class="text-cyan-600 font-bold hover:underline">Términos de Servicio</a> y la <a href="#" class="text-cyan-600 font-bold hover:underline">Política de Privacidad</a> de VeltraUI.</span>
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="w-full py-2.5 px-4 rounded-xl bg-gradient-to-r from-cyan-500 to-sky-600 hover:from-cyan-600 hover:to-sky-700 text-white font-bold text-xs flex items-center justify-center gap-2 shadow-md shadow-cyan-500/20 cursor-pointer transition-all mt-2">
          <span>Crear Cuenta y Comenzar</span>
          <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
        </button>
      </form>

      <!-- Card Footer -->
      <div class="mt-6 pt-5 border-t border-slate-100 text-center text-xs text-slate-500">
        ¿Ya tienes una cuenta registrada?
        <a href="/pages-login.html" class="font-bold text-cyan-600 hover:underline ml-1">Inicia sesión</a>
      </div>

    </div>
  </main>

  <!-- Simple Footer -->
  <footer class="p-6 text-center text-xs text-slate-400">
    <p>&copy; 2026 VeltraUI Technologies. Todos los derechos reservados.</p>
  </footer>

  <script type="module" src="/src/main.js"></script>
  <script>
    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = '<i data-lucide="eye-off" class="w-4 h-4"></i>';
      } else {
        input.type = 'password';
        btn.innerHTML = '<i data-lucide="eye" class="w-4 h-4"></i>';
      }
      if (window.lucide) window.lucide.createIcons();
    }

    function checkPasswordStrength(val) {
      const b1 = document.getElementById('bar-1');
      const b2 = document.getElementById('bar-2');
      const b3 = document.getElementById('bar-3');
      const label = document.getElementById('strength-label');

      b1.className = 'h-full w-1/3 bg-slate-200 rounded-full transition-colors';
      b2.className = 'h-full w-1/3 bg-slate-200 rounded-full transition-colors';
      b3.className = 'h-full w-1/3 bg-slate-200 rounded-full transition-colors';

      if (!val) {
        label.textContent = 'Ingresa una contraseña segura';
        return;
      }

      if (val.length < 6) {
        b1.classList.add('bg-rose-500');
        label.textContent = 'Seguridad Débil';
        label.className = 'text-rose-500 font-bold';
      } else if (val.length < 10) {
        b1.classList.add('bg-amber-500');
        b2.classList.add('bg-amber-500');
        label.textContent = 'Seguridad Media';
        label.className = 'text-amber-500 font-bold';
      } else {
        b1.classList.add('bg-emerald-500');
        b2.classList.add('bg-emerald-500');
        b3.classList.add('bg-emerald-500');
        label.textContent = 'Seguridad Fuerte';
        label.className = 'text-emerald-500 font-bold';
      }
    }
  </script>
</body>
</html>
